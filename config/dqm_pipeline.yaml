tag: EGM_Scouting_DQM_2026_v3
resonance: resonanceZ
output_dir: plot_DQM2026_check_STEAM

# Optional: estimate lumi_fb automatically with brilcalc.
lumi:
  use_brilcalc: true
  clean_env: true  # run brilcalc in a cleaned subprocess env (recommended)
  brilcalc_env: /cvmfs/cms-bril.cern.ch/cms-lumi-pog/brilws-docker/brilws-env
  brilcalc_bin: brilcalc
  calibration: web
  unit: /pb  # converted to /fb internally
  # normtag: /path/to/normtag.json

# Era inputs now come from DAS datasets + run filters.
eras:
#  2025_eraG:
#    label: Run2025G
#    year: 2025
#    golden_json: https://cms-service-dqmdc.web.cern.ch/CAF/certification/Collisions25/DCSOnly_JSONS/dailyDCSOnlyJSON/Collisions25_13p6TeV_Latest.json
#    file_glob: /eos/cms/store/group/comm_dqm/DQMGUI_data/Run2025/ScoutingPFMonitor/*/DQM_*__ScoutingPFMonitor__Run2025G-PromptReco-v1__DQMIO.root
#  2026_eraA:
#    label: Run2026A
#    year: 2026
#    golden_json: https://cms-service-dqmdc.web.cern.ch/CAF/certification/Collisions26/DCSOnly_JSONS/dailyDCSOnlyJSON/Collisions26_13p6TeV_Latest.json
#    file_glob: /eos/cms/store/group/comm_dqm/DQMGUI_data/Run2026/ScoutingPFMonitor/*/DQM_*__ScoutingPFMonitor__Run2026A-PromptReco-v1__DQMIO.root
  2026_eraB:
    label: Run2026B
    year: 2026
    golden_json: https://cms-service-dqmdc.web.cern.ch/CAF/certification/Collisions26/DCSOnly_JSONS/dailyDCSOnlyJSON/Collisions26_13p6TeV_Latest.json
    file_glob: /eos/cms/store/group/comm_dqm/DQMGUI_data/Run2026/ScoutingPFMonitor/*/DQM_*__ScoutingPFMonitor__Run2026B-PromptReco-v1__DQMIO.root
  2026_eraC:
    label: Run2026C
    year: 2026
    golden_json: https://cms-service-dqmdc.web.cern.ch/CAF/certification/Collisions26/DCSOnly_JSONS/dailyDCSOnlyJSON/Collisions26_13p6TeV_Latest.json
    file_glob: /eos/cms/store/group/comm_dqm/DQMGUI_data/Run2026/ScoutingPFMonitor/*/DQM_*__ScoutingPFMonitor__Run2026C-PromptReco-v1__DQMIO.root
    # Optional: omit run-requirement to use all runs from DAS (then golden_json filter still applies).
#    run-requirement:
#      min: 398000
#      max: 398999
#      # before: 398288
#      # after: 398120
#      min: 399000
#      max: 399999

mass_fit:
  enabled: true
  output_subdir: mass_fit
  rebin: 1   # default fit rebin for windows that do not specify rebin/nbins
  overlay_rebin: 2
  overlay_scale: lumi_fb  # none | lumi_fb | golden_lumisections
  hist_path_template: DQMData/Run {run}/HLT/Run summary/ScoutingOffline/EGamma/Collection/{var}
  variables:
    - sctElectron_EBEB_appliedID_invMass
    - sctElectron_EBEB_appliedID_invMass_pass_DST_PFScouting_DoubleEG_v
  fit_windows:
    Z:
      xmin: 70.0
      xmax: 110.0
      ymin: 80.0
      ymax: 100.0
      nbins: 40  # optional, takes precedence over rebin
    JPsi:
      xmin: 1.0
      xmax: 5.0
      ymin: 1.0
      ymax: 5.0
      nbins: 40

tnp_efficiency:
  enabled: true
  output_subdir: tnp_efficiency
  rebin: 1
  hist_path_template: DQMData/Run {run}/HLT/Run summary/ScoutingOffline/EGamma/TnP/{target_dir}/{hist}
  bins:
    pt: [0, 5, 10, 15, 20, 30, 40, 50, 80, 120, 200]
    eta: [-2.5, -2.0, -1.5, -1.0, -0.5, 0.0, 0.5, 1.0, 1.5, 2.0, 2.5]
  jobs:
    - name: dst_doubleEG_pat_leading_barrel
      tagging_type: pat
      probe_type: pat
      target_dir: Tag_PatElectron
      pt_order: leading
      axis: pt
      region: Barrel
      tags:
        - DST_PFScouting_DoubleEG_v
        - DST_PFScouting_DoubleEG_v_fireTrigObj
      include_mc: false
    - name: dst_doubleEG_pat_leading_barrel
      tagging_type: pat
      probe_type: pat
      target_dir: Tag_PatElectron
      pt_order: leading
      axis: pt
      region: Barrel
      tags:
        - DST_PFScouting_DoubleEG_v
        - DST_PFScouting_DoubleEG_v_fireTrigObj
      include_mc: false

quantity_per_era:
  enabled: true
  output_subdir: quantityPlot
  rebin: 2
  scale_to: 100000.0
  target_dir: Tag_PatElectron
  tagging_type: pat
  probe_types: [pat, sct]
  regions: [Barrel, Endcap]
  quantities:
    - Pt
    - HoverE
    - OoEMOoP
    - MissingHits
    - RelEcalIsolation
    - RelHcalIsolation
    - RelTrackIsolation
    - SigmaIetaIeta
    - Trackfbrem
    - dEtaIn
    - dPhiIn
  hist_path_template: DQMData/Run {run}/HLT/Run summary/ScoutingOffline/EGamma/TnP/{target_dir}/{hist}
  quantity_overrides:
    Pt:
      x_range: [0.0, 130.0]

filter_monitoring:
  enabled: true
  output_subdir: filter_monitoring
  rebin: 1
  ratio_ymin: 0.9
  ratio_ymax: 1.1
  legend_cols: 2
  save_era_comparison: true
  save_run_trends: true
  hist_path_template: DQMData/Run {run}/HLT/Run summary/ScoutingOffline/EGamma/TnP/{target_dir}/{hist}
  trigger_setting:
    DST_PFScouting_DoubleEG_v:
      - hltEGL1DoubleIsoEG11Filter
      - hltDoubleEG11CaloIdLEt11Filter
      - hltDoubleEG11CaloIdLClusterShapeFilter
      - hltDoubleEG11CaloIdLHEFilter
    DST_PFScouting_SinglePhotonEB_v:
      - hltEGL1SingleEGOrFilter
      - hltEG30EBTightIDTightIsoEtFilter
      - hltEG30EBTightIDTightIsoClusterShapeFilter
      - hltEG30EBTightIDTightIsoHEFilter
      - hltEG30EBTightIDTightIsoR9Filter
      - hltEG30EBTightIDTightIsotEcalIsoFilter
      - hltEG30EBTightIDTightIsoHcalIsoFilter
      - hltEG30EBTightIDTightIsoTrackIsoFilter
  bins:
    pt: [0, 5, 10, 15, 20, 30, 40, 50, 80, 120, 200]
    eta: [-2.5, -2.0, -1.5, -1.0, -0.5, 0.0, 0.5, 1.0, 1.5, 2.0, 2.5]
  jobs:
    - name: dst_doubleEG_patTag_sctProbe_leading_barrel_filters
      tagging_type: pat
      probe_type: sct
      target_dir: Tag_PatElectron
      pt_order: leading
      axis: pt
      region: Barrel
      base_tags:
        - DST_PFScouting_DoubleEG_v

    - name: dst_doubleEG_patTag_sctProbe_leading_endcap_filters
      tagging_type: pat
      probe_type: sct
      target_dir: Tag_PatElectron
      pt_order: leading
      axis: pt
      region: Endcap
      base_tags:
        - DST_PFScouting_DoubleEG_v

    - name: dst_doubleEG_patTag_sctProbe_subleading_barrel_filters
      tagging_type: pat
      probe_type: sct
      target_dir: Tag_PatElectron
      pt_order: subleading
      axis: pt
      region: Barrel
      base_tags:
        - DST_PFScouting_DoubleEG_v

    - name: dst_doubleEG_patTag_sctProbe_subleading_endcap_filters
      tagging_type: pat
      probe_type: sct
      target_dir: Tag_PatElectron
      pt_order: subleading
      axis: pt
      region: Endcap
      base_tags:
        - DST_PFScouting_DoubleEG_v

    - name: dst_singlePhotonEB_patTag_sctProbe_leading_barrel_filters
      tagging_type: pat
      probe_type: sct
      target_dir: Tag_PatElectron
      pt_order: leading
      axis: pt
      region: Barrel
      base_tags:
        - DST_PFScouting_SinglePhotonEB_v

    - name: dst_singlePhotonEB_patTag_sctProbe_leading_endcap_filters
      tagging_type: pat
      probe_type: sct
      target_dir: Tag_PatElectron
      pt_order: leading
      axis: pt
      region: Endcap
      base_tags:
        - DST_PFScouting_SinglePhotonEB_v

    - name: dst_singlePhotonEB_patTag_sctProbe_subleading_barrel_filters
      tagging_type: pat
      probe_type: sct
      target_dir: Tag_PatElectron
      pt_order: subleading
      axis: pt
      region: Barrel
      base_tags:
        - DST_PFScouting_SinglePhotonEB_v

    - name: dst_singlePhotonEB_patTag_sctProbe_subleading_endcap_filters
      tagging_type: pat
      probe_type: sct
      target_dir: Tag_PatElectron
      pt_order: subleading
      axis: pt
      region: Endcap
      base_tags:
        - DST_PFScouting_SinglePhotonEB_v
